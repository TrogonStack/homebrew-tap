name: Autobump Formulas

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: resolve versions and compute SHA256s but do not open PRs"
        type: boolean
        default: false

jobs:
  bump:
    name: Bump ${{ matrix.formula }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: autobump-${{ matrix.formula }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - formula: trg
            formula_file: Formula/trg.rb
            upstream_repo: TrogonStack/rusty-monorepo
            tag_prefix: trg@v
            # {name}-{version}-{arch}.tar.gz
            url_style: rust
            archs: >-
              aarch64-apple-darwin
              x86_64-apple-darwin
              aarch64-unknown-linux-gnu
              x86_64-unknown-linux-gnu

          - formula: protoc-gen-elixir-grpc
            formula_file: Formula/protoc-gen-elixir-grpc.rb
            upstream_repo: TrogonStack/protoc-gen
            tag_prefix: protoc-gen-elixir-grpc@v
            # {name}@v{version}_{OS}_{arch}.tar.gz
            url_style: goreleaser
            archs: >-
              Darwin_arm64
              Darwin_x86_64
              Linux_arm64
              Linux_x86_64

          - formula: protoc-gen-connect-go-servicestruct
            formula_file: Formula/protoc-gen-connect-go-servicestruct.rb
            upstream_repo: TrogonStack/protoc-gen
            tag_prefix: protoc-gen-connect-go-servicestruct@v
            url_style: goreleaser
            archs: >-
              Darwin_arm64
              Darwin_x86_64
              Linux_arm64
              Linux_x86_64

          - formula: otel-collector
            formula_file: Formula/otel-collector.rb
            upstream_repo: open-telemetry/opentelemetry-collector-releases
            tag_prefix: "v"
            url_style: otelcol
            archs: >-
              darwin_amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest upstream version
        id: upstream
        run: |
          VERSION=$(.github/scripts/autobump/get-upstream-version.sh \
            "${{ matrix.upstream_repo }}" "${{ matrix.tag_prefix }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get current formula version
        id: current
        run: |
          VERSION=$(.github/scripts/autobump/get-current-version.sh \
            "${{ matrix.formula_file }}" "${{ matrix.formula }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if bump needed
        id: check
        run: |
          NEEDED=$(.github/scripts/autobump/check-bump-needed.sh \
            "${{ matrix.formula }}" \
            "${{ steps.current.outputs.version }}" \
            "${{ steps.upstream.outputs.version }}")
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"

      - name: Fetch SHA256 checksums
        if: steps.check.outputs.needed == 'true'
        run: |
          .github/scripts/autobump/fetch-checksums.sh \
            "${{ matrix.formula }}" \
            "${{ steps.upstream.outputs.version }}" \
            "${{ matrix.tag_prefix }}" \
            "${{ matrix.url_style }}" \
            "${{ matrix.upstream_repo }}" \
            "$RUNNER_TEMP/checksums.env" \
            ${{ matrix.archs }}

      - name: Update formula
        if: steps.check.outputs.needed == 'true'
        run: |
          python3 .github/scripts/autobump/update-formula.py \
            "${{ matrix.formula_file }}" \
            "${{ steps.upstream.outputs.version }}" \
            "${{ matrix.formula }}" \
            "${{ matrix.tag_prefix }}" \
            "${{ matrix.url_style }}" \
            "${{ matrix.upstream_repo }}" \
            "$RUNNER_TEMP/checksums.env" \
            ${{ matrix.archs }}

      - name: Dry run summary
        if: steps.check.outputs.needed == 'true' && inputs.dry_run
        run: |
          echo "### Dry run: ${{ matrix.formula }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Current version**: \`${{ steps.current.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **New version**: \`${{ steps.upstream.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Would open PR**: bump-${{ matrix.formula }}-${{ steps.upstream.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Updated formula:**" >> $GITHUB_STEP_SUMMARY
          echo '```ruby' >> $GITHUB_STEP_SUMMARY
          cat ${{ matrix.formula_file }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Open PR
        if: steps.check.outputs.needed == 'true' && !inputs.dry_run
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_PAT_RELEASE_PLEASE_ACTION }}
          commit-message: "feat: bump ${{ matrix.formula }} to ${{ steps.upstream.outputs.version }}\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: "bump-${{ matrix.formula }}-${{ steps.upstream.outputs.version }}"
          title: "feat: bump ${{ matrix.formula }} to ${{ steps.upstream.outputs.version }}"
          body: |
            Automated formula bump for `${{ matrix.formula }}`.

            - **Previous version**: `${{ steps.current.outputs.version }}`
            - **New version**: `${{ steps.upstream.outputs.version }}`
          labels: |
            bot
            bump-formula-pr

      - name: Close superseded bump PRs
        if: steps.check.outputs.needed == 'true' && !inputs.dry_run && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_RELEASE_PLEASE_ACTION }}
        run: |
          .github/scripts/autobump/close-superseded-prs.sh \
            "${{ github.repository }}" \
            "${{ matrix.formula }}" \
            "bump-${{ matrix.formula }}-${{ steps.upstream.outputs.version }}" \
            "${{ steps.cpr.outputs.pull-request-number }}"
