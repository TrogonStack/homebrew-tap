name: Audit Formulae

on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/audit-formulae.yml"
      - "scripts/check-formula-versions.rb"
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - ".github/workflows/audit-formulae.yml"
      - "scripts/check-formula-versions.rb"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.10.1
        with:
          stable: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit all formulae
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t formulae < <(brew tap-info --json trogonstack/tap | jq -r '.[0].formula_names[]')
          if (( ${#formulae[@]} == 0 )); then
            echo "No formulae found in trogonstack/tap." >&2
            exit 1
          fi
          brew ruby -- scripts/check-formula-versions.rb "${formulae[@]}"
          brew audit --skip-style --formula "${formulae[@]}"
